<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
<style>
    .Add-button{
        background-color: yellow;
        color:black;
        border-width: 3px;
        border-color: black;
    }
    .buy-button{
        background-color:coral;
        color:black;
        border-width: 3px;
        border-color: black;
    }
</style>
</head>
<body>
    <p>Adults Plain Cotton T-shirts</p>

    <p>Price $7.99</p>

<button class="Add-button" onclick="alert('Added')";>Add to Cart</button>

<button class="buy-button" onclick="alert('Loading')";>Buy Now</button>
</body>
</html>
